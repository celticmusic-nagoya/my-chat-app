<!DOCTYPE html>
<html lang="ja" class="h-full bg-gray-900 text-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slack Style Chat App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (v9 Moduler compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slack: {
                            sidebar: '#19171D',
                            sidebarHover: '#27242C',
                            sidebarActive: '#1164A3',
                            bg: '#1A1D21',
                            card: '#222529',
                            border: '#383B40',
                            accent: '#007a5a',
                            accentHover: '#148567'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
        .app-height { height: 100vh; height: 100dvh; }
    </style>
</head>
<body class="h-full overflow-hidden antialiased select-none font-sans bg-slack-bg text-gray-200">

<div id="app" class="flex flex-col app-height w-full overflow-hidden">

    <!-- ================= 画面ヘッダー ================= -->
    <header class="h-13 bg-slack-sidebar border-b border-slack-border flex items-center justify-between px-3 md:px-4 shrink-0 z-20">
        <div class="flex items-center gap-2 md:gap-3">
            <button id="mobile-menu-btn" class="md:hidden p-2 text-gray-300 hover:text-white rounded hover:bg-slack-sidebarHover">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center gap-2">
                <span id="current-channel-icon" class="text-gray-400 text-lg">#</span>
                <h1 id="current-channel-title" class="font-bold text-white text-base md:text-lg truncate max-w-[150px] sm:max-w-[250px]">全体チャット</h1>
            </div>
            <span id="demo-badge" class="hidden sm:inline-block text-[10px] bg-yellow-500/20 text-yellow-300 border border-yellow-500/30 px-2 py-0.5 rounded-full font-mono">デモモード</span>
        </div>

        <!-- 右: アイコン画像設定 & 名前入力 & 通信設定ボタン -->
        <div class="flex items-center gap-2">
            <div class="flex items-center gap-1.5 bg-slack-card border border-slack-border rounded-lg px-2 py-1">
                <label for="avatar-input" class="cursor-pointer relative group flex-shrink-0" title="アイコン画像を選択">
                    <div id="avatar-preview" class="w-6 h-6 rounded-full bg-slack-sidebarActive text-white flex items-center justify-center font-bold text-xs overflow-hidden border border-gray-600">
                        👤
                    </div>
                    <div class="absolute inset-0 bg-black/50 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center text-[10px] text-white transition-opacity">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                </label>
                <input type="file" id="avatar-input" accept="image/*" class="hidden">

                <input type="text" id="user-name-input" class="bg-transparent text-xs md:text-sm text-gray-200 focus:outline-none w-20 sm:w-28 placeholder-gray-500 font-medium" placeholder="表示名" value="ゲスト">
            </div>

            <button id="open-config-btn" class="p-2 text-gray-300 hover:text-white rounded hover:bg-slack-sidebarHover relative" title="Firebase通信設定">
                <i class="fa-solid fa-gear text-lg"></i>
                <span id="status-indicator" class="absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-yellow-500 border-2 border-slack-sidebar"></span>
            </button>
        </div>
    </header>

    <!-- ================= メインコンテンツエリア ================= -->
    <div class="flex-1 flex overflow-hidden relative">

        <div id="mobile-backdrop" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden transition-opacity"></div>

        <!-- 1. 左サイドバー -->
        <aside id="sidebar" class="absolute md:relative z-40 w-64 h-full bg-slack-sidebar border-r border-slack-border flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0 shrink-0">
            <div class="p-4 border-b border-slack-border/50 flex items-center justify-between">
                <div>
                    <h2 class="font-bold text-white text-base truncate">WEB訓練校 自習室</h2>
                    <p class="text-xs text-gray-400 flex items-center gap-1.5 mt-0.5">
                        <span id="connection-status-text" class="inline-block w-2 h-2 rounded-full bg-yellow-500"></span>
                        <span id="connection-status-label">未設定</span>
                    </p>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-3 space-y-6">
                <div>
                    <div class="flex items-center justify-between text-xs font-semibold text-gray-400 px-2 mb-2">
                        <span>チャンネル</span>
                        <button id="add-channel-btn" class="hover:text-white p-1" title="新しいチャンネルを作成"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <ul id="channel-list" class="space-y-0.5 text-sm"></ul>
                </div>
            </div>
            <div class="p-3 border-t border-slack-border/50 text-xs text-gray-500 text-center">Web Training Chat v1.7</div>
        </aside>

        <!-- 2. 中央メインチャットエリア -->
        <main class="flex-1 flex flex-col bg-slack-bg h-full min-w-0 relative">
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

            <div class="p-3 md:p-4 bg-slack-bg border-t border-slack-border/60 shrink-0">
                <form id="message-form" class="bg-slack-card border border-slack-border rounded-lg p-2 focus-within:border-gray-500 transition-colors">
                    <div id="code-input-container" class="hidden mb-2">
                        <div class="flex items-center justify-between text-xs text-gray-400 mb-1 px-1">
                            <span><i class="fa-solid fa-code mr-1"></i> コードスニペット</span>
                            <button type="button" id="close-code-btn" class="hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <textarea id="code-input" rows="3" class="w-full bg-gray-950 text-emerald-400 font-mono text-xs p-2 rounded border border-gray-800 focus:outline-none resize-none" placeholder="// ここにコードを貼り付け"></textarea>
                    </div>

                    <textarea id="message-input" rows="2" class="w-full bg-transparent text-gray-100 text-sm focus:outline-none resize-none px-1 placeholder-gray-500" placeholder="メッセージを送信... (Enterで送信)"></textarea>

                    <div class="flex items-center justify-between pt-2 border-t border-slack-border/40 mt-1">
                        <div class="flex items-center gap-1 text-gray-400">
                            <button type="button" id="toggle-code-btn" class="p-1.5 hover:text-white hover:bg-slack-sidebarHover rounded text-xs flex items-center gap-1">
                                <i class="fa-solid fa-code text-sm"></i>
                                <span class="text-[11px] hidden sm:inline">コード</span>
                            </button>
                        </div>
                        <button type="submit" class="bg-slack-accent hover:bg-slack-accentHover text-white px-3 py-1.5 rounded text-xs font-medium flex items-center gap-1.5 transition-colors">
                            <span>送信</span>
                            <i class="fa-solid fa-paper-plane text-[10px]"></i>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<!-- 通信設定 モーダル -->
<div id="config-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slack-card border border-slack-border rounded-xl max-w-lg w-full p-5 shadow-2xl space-y-4">
        <div class="flex items-center justify-between border-b border-slack-border pb-3">
            <h3 class="font-bold text-white text-base flex items-center gap-2"><i class="fa-solid fa-bolt text-yellow-400"></i> Firebase通信設定</h3>
            <button id="close-config-modal-btn" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div>
            <textarea id="firebase-config-input" rows="6" class="w-full bg-gray-950 text-emerald-400 font-mono text-xs p-3 rounded-lg border border-gray-800 focus:outline-none resize-none" placeholder='{ "apiKey": "..." }'></textarea>
        </div>
        <div class="flex items-center justify-between pt-2">
            <button id="clear-config-btn" type="button" class="text-xs text-red-400 hover:text-red-300 underline">設定クリア</button>
            <button id="save-config-btn" type="button" class="bg-slack-accent hover:bg-slack-accentHover text-white px-4 py-2 rounded-lg text-xs font-medium">設定を保存して接続</button>
        </div>
    </div>
</div>

<script>
    let DEFAULT_CHANNELS = [
        { id: 'general', name: '全体チャット', icon: '#', code: null },
        { id: 'js-study', name: 'JavaScript勉強会', icon: '#', code: null },
        { id: 'tasks', name: '課題・制作物共有', icon: '#', code: null }
    ];

    let state = {
        currentChannel: 'general',
        currentUser: localStorage.getItem('chat_user_name') || 'ユーザー' + Math.floor(Math.random() * 899 + 100),
        userAvatar: localStorage.getItem('chat_user_avatar') || null,
        unlockedChannels: ['general', 'js-study', 'tasks'],
        messages: {},
        firebaseApp: null,
        db: null,
        isFirebaseActive: false
    };

    const elements = {
        channelList: document.getElementById('channel-list'),
        messagesContainer: document.getElementById('messages-container'),
        messageForm: document.getElementById('message-form'),
        messageInput: document.getElementById('message-input'),
        codeInput: document.getElementById('code-input'),
        codeInputContainer: document.getElementById('code-input-container'),
        toggleCodeBtn: document.getElementById('toggle-code-btn'),
        closeCodeBtn: document.getElementById('close-code-btn'),
        userNameInput: document.getElementById('user-name-input'),
        avatarInput: document.getElementById('avatar-input'),
        avatarPreview: document.getElementById('avatar-preview'),
        currentChannelTitle: document.getElementById('current-channel-title'),
        currentChannelIcon: document.getElementById('current-channel-icon'),
        sidebar: document.getElementById('sidebar'),
        mobileMenuBtn: document.getElementById('mobile-menu-btn'),
        mobileBackdrop: document.getElementById('mobile-backdrop'),
        configModal: document.getElementById('config-modal'),
        openConfigBtn: document.getElementById('open-config-btn'),
        closeConfigModalBtn: document.getElementById('close-config-modal-btn'),
        saveConfigBtn: document.getElementById('save-config-btn'),
        clearConfigBtn: document.getElementById('clear-config-btn'),
        firebaseConfigInput: document.getElementById('firebase-config-input'),
        statusIndicator: document.getElementById('status-indicator'),
        connectionStatusText: document.getElementById('connection-status-text'),
        connectionStatusLabel: document.getElementById('connection-status-label'),
        demoBadge: document.getElementById('demo-badge'),
        addChannelBtn: document.getElementById('add-channel-btn')
    };

    function init() {
        elements.userNameInput.value = state.currentUser;
        updateAvatarPreview();
        setupEventListeners();
        renderSidebar();
        initFirebaseFromStorage();
    }

    function updateAvatarPreview() {
        if (state.userAvatar) {
            elements.avatarPreview.innerHTML = `<img src="${state.userAvatar}" class="w-full h-full object-cover">`;
        } else {
            elements.avatarPreview.textContent = state.currentUser.charAt(0);
        }
    }

    function initFirebaseFromStorage() {
        const savedConfig = localStorage.getItem('firebase_config');
        if (savedConfig) {
            try {
                const configObj = parseFirebaseConfig(savedConfig);
                if (configObj && configObj.apiKey) {
                    if (!firebase.apps.length) {
                        state.firebaseApp = firebase.initializeApp(configObj);
                    } else {
                        state.firebaseApp = firebase.app();
                    }
                    state.db = firebase.database();
                    state.isFirebaseActive = true;
                    updateConnectionUI(true);
                    listenToFirebaseMessages();
                    return;
                }
            } catch (err) { console.error(err); }
        }
        state.isFirebaseActive = false;
        updateConnectionUI(false);
    }

    function parseFirebaseConfig(str) {
        try { return JSON.parse(str); } catch (e) {
            let clean = str.replace(/const\s+firebaseConfig\s*=\s*/, '').replace(/;\s*$/, '').trim();
            clean = clean.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
            return JSON.parse(clean);
        }
    }

    function updateConnectionUI(isConnected) {
        if (isConnected) {
            elements.statusIndicator.className = "absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-slack-sidebar";
            elements.connectionStatusText.className = "inline-block w-2 h-2 rounded-full bg-emerald-500";
            elements.connectionStatusLabel.textContent = "接続完了";
            elements.demoBadge.classList.add('hidden');
        } else {
            elements.statusIndicator.className = "absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-yellow-500 border-2 border-slack-sidebar";
            elements.connectionStatusText.className = "inline-block w-2 h-2 rounded-full bg-yellow-500";
            elements.connectionStatusLabel.textContent = "未設定";
            elements.demoBadge.classList.remove('hidden');
        }
    }

    function listenToFirebaseMessages() {
        if (!state.db) return;
        const ref = state.db.ref(`messages/${state.currentChannel}`);
        ref.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state.messages[state.currentChannel] = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            } else {
                state.messages[state.currentChannel] = [];
            }
            renderMessages();
        });
    }

    function setupEventListeners() {
        elements.userNameInput.addEventListener('input', (e) => {
            const val = e.target.value.trim() || '名無し';
            state.currentUser = val;
            localStorage.setItem('chat_user_name', val);
            updateAvatarPreview();
        });

        elements.avatarInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 64;
                    canvas.height = 64;
                    ctx.drawImage(img, 0, 0, 64, 64);
                    const base64Url = canvas.toDataURL('image/jpeg', 0.8);
                    
                    state.userAvatar = base64Url;
                    localStorage.setItem('chat_user_avatar', base64Url);
                    updateAvatarPreview();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        elements.toggleCodeBtn.addEventListener('click', () => {
            elements.codeInputContainer.classList.toggle('hidden');
            if (!elements.codeInputContainer.classList.contains('hidden')) elements.codeInput.focus();
        });

        elements.closeCodeBtn.addEventListener('click', () => elements.codeInputContainer.classList.add('hidden'));
        elements.mobileMenuBtn.addEventListener('click', toggleMobileSidebar);
        elements.mobileBackdrop.addEventListener('click', toggleMobileSidebar);

        elements.openConfigBtn.addEventListener('click', () => {
            elements.firebaseConfigInput.value = localStorage.getItem('firebase_config') || '';
            elements.configModal.classList.remove('hidden');
        });

        elements.closeConfigModalBtn.addEventListener('click', () => elements.configModal.classList.add('hidden'));

        elements.saveConfigBtn.addEventListener('click', () => {
            const val = elements.firebaseConfigInput.value.trim();
            if (val) {
                try {
                    parseFirebaseConfig(val);
                    localStorage.setItem('firebase_config', val);
                    location.reload();
                } catch (err) { alert('設定形式エラーです。'); }
            }
        });

        elements.clearConfigBtn.addEventListener('click', () => {
            if (confirm('設定をクリアしますか？')) {
                localStorage.removeItem('firebase_config');
                location.reload();
            }
        });

        elements.messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage();
        });

        elements.messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // チャンネル追加
        elements.addChannelBtn.addEventListener('click', () => {
            const channelName = prompt('新しいチャンネル名を入力してください:');
            if (!channelName) return;

            const isPrivate = confirm('このチャンネルを【鍵付き（クローズド）】にしますか？\n（キャンセルを押すと全員が参加できる通常チャンネルになります）');
            
            let passCode = null;
            if (isPrivate) {
                passCode = prompt('参加に必要な【参加コード（パスコード）】を設定してください:');
                if (!passCode) {
                    alert('参加コードが設定されなかったため作成をキャンセルしました。');
                    return;
                }
            }

            const id = 'channel-' + Date.now();
            const newChannel = {
                id: id,
                name: channelName.trim(),
                icon: isPrivate ? '🔒' : '#',
                code: passCode ? passCode.trim() : null
            };

            DEFAULT_CHANNELS.push(newChannel);
            state.unlockedChannels.push(id);

            renderSidebar();
            switchChannel(id, newChannel.name, newChannel.icon, newChannel.code);
        });
    }

    function toggleMobileSidebar() {
        elements.sidebar.classList.toggle('-translate-x-full');
        elements.mobileBackdrop.classList.toggle('hidden');
    }

    function renderSidebar() {
        elements.channelList.innerHTML = DEFAULT_CHANNELS.map(ch => {
            const isLocked = ch.code && !state.unlockedChannels.includes(ch.id);
            const isGeneral = ch.id === 'general';

            return `
                <li class="group relative flex items-center">
                    <button onclick="handleChannelClick('${ch.id}', '${ch.name}', '${ch.icon}', '${ch.code || ''}')" 
                        class="w-full text-left px-2 py-1.5 rounded flex items-center gap-2 transition-colors ${state.currentChannel === ch.id ? 'bg-slack-sidebarActive text-white font-medium' : 'text-gray-400 hover:bg-slack-sidebarHover hover:text-gray-200'}">
                        <span class="text-xs ${isLocked ? 'text-yellow-500' : 'text-gray-500'} font-bold">${ch.icon}</span>
                        <span class="truncate pr-5">${ch.name}</span>
                        ${isLocked ? '<i class="fa-solid fa-lock text-[10px] ml-auto text-yellow-500/80 mr-4"></i>' : ''}
                    </button>
                    ${!isGeneral ? `
                        <button onclick="deleteChannel('${ch.id}', '${ch.name}', event)" class="absolute right-1 text-gray-500 hover:text-red-400 opacity-100 sm:opacity-0 group-hover:opacity-100 p-1 transition-opacity" title="チャンネルを削除">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    ` : ''}
                </li>
            `;
        }).join('');
    }

    function handleChannelClick(id, name, icon, code) {
        if (code && code !== 'null' && code !== '' && !state.unlockedChannels.includes(id)) {
            const inputCode = prompt(`「${name}」は鍵付きチャンネルです。\n参加コードを入力してください:`);
            if (inputCode === code) {
                alert('認証に成功しました！');
                state.unlockedChannels.push(id);
                renderSidebar();
                switchChannel(id, name, icon, code);
            } else if (inputCode !== null) {
                alert('参加コードが違います。');
            }
            return;
        }

        switchChannel(id, name, icon, code);
    }

    function switchChannel(id, name, icon, code) {
        state.currentChannel = id;
        elements.currentChannelTitle.textContent = name;
        elements.currentChannelIcon.textContent = icon;
        renderSidebar();
        if (!elements.sidebar.classList.contains('-translate-x-full')) toggleMobileSidebar();
        if (state.isFirebaseActive) listenToFirebaseMessages();
        else renderMessages();
    }

    // チャンネル削除処理
    function deleteChannel(channelId, channelName, event) {
        event.stopPropagation(); // チャンネル切り替えイベントの連動を防止

        if (confirm(`チャンネル「${channelName}」を削除してもよろしいですか？\n（チャンネル内の全メッセージデータも削除されます）`)) {
            // 配列から削除
            DEFAULT_CHANNELS = DEFAULT_CHANNELS.filter(ch => ch.id !== channelId);
            state.unlockedChannels = state.unlockedChannels.filter(id => id !== channelId);

            // Firebase上のメッセージデータも完全削除
            if (state.isFirebaseActive && state.db) {
                state.db.ref(`messages/${channelId}`).remove();
            }

            // 現在開いているチャンネルが削除された場合、「全体チャット」に戻す
            if (state.currentChannel === channelId) {
                const generalCh = DEFAULT_CHANNELS[0];
                switchChannel(generalCh.id, generalCh.name, generalCh.icon, generalCh.code);
            } else {
                renderSidebar();
            }
        }
    }

    function renderMessages() {
        const currentMsgs = state.messages[state.currentChannel] || [];
        if (currentMsgs.length === 0) {
            elements.messagesContainer.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center text-gray-500 space-y-2">
                    <i class="fa-regular fa-comments text-4xl"></i>
                    <p class="text-sm">メッセージがまだありません</p>
                </div>`;
            return;
        }

        elements.messagesContainer.innerHTML = currentMsgs.map(msg => {
            const avatarHtml = msg.avatar ? 
                `<img src="${msg.avatar}" class="w-full h-full object-cover">` : 
                escapeHtml(msg.user.charAt(0));

            return `
                <div class="group relative flex gap-3 px-2 py-1.5 hover:bg-slack-sidebarHover/40 rounded">
                    <div class="w-8 h-8 rounded-full bg-slack-sidebarActive text-white flex items-center justify-center font-bold text-xs shrink-0 overflow-hidden border border-gray-700 select-none">
                        ${avatarHtml}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-baseline gap-2">
                            <span class="font-bold text-white text-sm truncate">${escapeHtml(msg.user)}</span>
                            <span class="text-[10px] text-gray-500">${msg.timestamp || ''}</span>
                        </div>
                        ${msg.text ? `<p class="text-sm text-gray-200 mt-0.5 whitespace-pre-wrap leading-relaxed">${escapeHtml(msg.text)}</p>` : ''}
                        ${msg.code ? `<pre class="mt-2 p-2 bg-gray-950 text-emerald-400 font-mono text-xs rounded border border-gray-800 overflow-x-auto"><code>${escapeHtml(msg.code)}</code></pre>` : ''}
                    </div>
                    
                    <button onclick="deleteMessage('${msg.id}')" class="opacity-0 group-hover:opacity-100 transition-opacity p-1.5 text-gray-400 hover:text-red-400 hover:bg-slack-card rounded absolute right-2 top-2" title="メッセージを削除">
                        <i class="fa-regular fa-trash-can text-xs"></i>
                    </button>
                </div>
            `;
        }).join('');

        elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
    }

    function sendMessage() {
        const text = elements.messageInput.value.trim();
        const code = elements.codeInput.value.trim();
        if (!text && !code) return;

        const now = new Date();
        const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

        const newMsg = {
            user: state.currentUser,
            avatar: state.userAvatar || null,
            text: text,
            code: code || null,
            timestamp: timeStr
        };

        if (state.isFirebaseActive && state.db) {
            state.db.ref(`messages/${state.currentChannel}`).push(newMsg);
        }

        elements.messageInput.value = '';
        elements.codeInput.value = '';
        elements.codeInputContainer.classList.add('hidden');
    }

    function deleteMessage(msgId) {
        if (!msgId) return;
        if (confirm('このメッセージを削除しますか？')) {
            if (state.isFirebaseActive && state.db) {
                state.db.ref(`messages/${state.currentChannel}/${msgId}`).remove();
            }
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
